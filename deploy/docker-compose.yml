# ==============================================================================
# Docker Compose Orchestration
# QuickPay & Notify Studio - Production Stack (App + Nginx + Certbot + SQLite)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Application Server (Node.js 20 LTS + SQLite)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: quickpay-app:latest
    container_name: quickpay-app-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_PATH=/app/database/payments.db
    volumes:
      # Persistent host volume for SQLite database and WAL files
      - ../database:/app/database
    networks:
      - quickpay-network
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (SSL Termination, Gzip, Security Headers, Proxy)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: quickpay-app-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certbot/conf:/etc/letsencrypt:ro
      - ../certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - quickpay-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Certbot (Automatic SSL Certificate Renewal Daemon)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: quickpay-app-certbot
    restart: unless-stopped
    volumes:
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - quickpay-network
    depends_on:
      - nginx

# ------------------------------------------------------------------------------
# Bridge Network Definition
# ------------------------------------------------------------------------------
networks:
  quickpay-network:
    name: quickpay-network
    driver: bridge
