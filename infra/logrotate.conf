# ==============================================================================
# QuickPay & Notify Studio - Logrotate Configuration
# Prevents container and Nginx logs from consuming AWS Free Tier 30GB EBS storage
# Install: sudo cp infra/logrotate.conf /etc/logrotate.d/quickpay-app
# ==============================================================================

/var/lib/docker/containers/*/*-json.log {
    daily
    rotate 5
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    maxsize 10M
}

/home/ubuntu/Dummy-small-prod-app/logs/*.log {
    weekly
    rotate 4
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    maxsize 20M
}
